// Sblurp community server protocol, version 1.
//
// Compatibility rules (servers are self-hosted and upgrade on their own
// schedule, so one client talks to many server versions):
//   - Never renumber or reuse a field number. Reserve removed ones.
//   - New fields must be optional in meaning: an old peer ignores them.
//   - Bump PROTOCOL_VERSION only for a change an old client cannot ignore.
syntax = "proto3";

package sblurp.v1;

option go_package = "sblurp.chat/server/gen/sblurp/v1;sblurpv1";

// ---------------------------------------------------------------------------
// Core types
// ---------------------------------------------------------------------------

enum MemberKind {
  MEMBER_KIND_UNSPECIFIED = 0;
  MEMBER_KIND_HUMAN = 1;
  MEMBER_KIND_BOT = 2;
}

enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_MEMBER = 1;
  MEMBER_ROLE_MODERATOR = 2;
  MEMBER_ROLE_ADMIN = 3;
  MEMBER_ROLE_OWNER = 4;
}

enum Presence {
  PRESENCE_UNSPECIFIED = 0;
  PRESENCE_ONLINE = 1;
  PRESENCE_AWAY = 2;
  PRESENCE_OFFLINE = 3;
}

message Member {
  string id = 1;              // UUIDv7, local to this server
  MemberKind kind = 2;
  MemberRole role = 3;
  string username = 4;        // unique on this server
  string display_name = 5;
  string avatar_url = 6;      // may be empty
  string bio = 7;
  Presence presence = 8;
  int64 joined_at_ms = 9;
  string status_text = 10;    // short custom status, may be empty
  string status_emoji = 11;
  repeated string role_ids = 12; // custom roles (visibility only), see Role
}

// A custom role, made by admins. Roles only decide which text channels a
// member can see (Channel.role_ids). MemberRole still decides permissions;
// call that one "Permission" in the UI and these "Roles".
message Role {
  string id = 1;
  string name = 2;            // unique, case-insensitive
  string color = 3;           // "#rrggbb" or empty
  int32 position = 4;         // sort order, low first
}

// How members get into text channels. Private channels and DMs keep their
// explicit member lists in both modes.
enum ChannelMode {
  CHANNEL_MODE_UNSPECIFIED = 0;
  CHANNEL_MODE_ROLES = 1;     // Discord-like: you are in every text channel you can see
  CHANNEL_MODE_OPT_IN = 2;    // Slack-like: browse the channels you can see, join and leave them
}

enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  CHANNEL_KIND_TEXT = 1;      // every member can see it, unless role_ids limits it
  CHANNEL_KIND_PRIVATE = 2;   // invite only
  CHANNEL_KIND_DM = 3;        // direct message, 2+ members
}

message Channel {
  string id = 1;
  ChannelKind kind = 2;
  string name = 3;            // empty for DMs
  string topic = 4;
  string category = 5;        // sidebar section, e.g. "General"; empty = none
  int32 position = 6;         // sort order inside the category
  repeated string member_ids = 7; // set for DM and PRIVATE channels
  int64 created_at_ms = 8;
  int64 last_message_seq = 9; // seq of the newest message, 0 if none
  // TEXT only. Empty: every member can see the channel. Otherwise only
  // members with one of these roles (and admins and the owner) can.
  repeated string role_ids = 10;
  bool is_default = 11;       // TEXT only: OPT_IN mode joins new members to it
  int32 member_count = 12;    // set by BrowseChannels only; 0 elsewhere
  Attachment header_image = 13; // optional image behind the channel header
}

message Attachment {
  string id = 1;
  string name = 2;
  string content_type = 3;
  int64 size = 4;
  string url = 5;             // relative to the server base URL
  int32 width = 6;            // images only
  int32 height = 7;
}

message Reaction {
  string emoji = 1;           // unicode emoji or ":shortcode:"
  repeated string member_ids = 2;
}

message Message {
  string id = 1;
  string channel_id = 2;
  string author_id = 3;
  string text = 4;            // markdown subset: bold, italic, code, links, mentions <@member_id>
  int64 created_at_ms = 5;
  int64 edited_at_ms = 6;     // 0 if never edited
  bool deleted = 7;
  string thread_root_id = 8;  // set when this message is a thread reply
  int32 reply_count = 9;      // on a thread root
  int64 last_reply_at_ms = 10;
  repeated Reaction reactions = 11;
  repeated Attachment attachments = 12;
  string client_id = 13;      // echo of SendMessageRequest.client_id, for optimistic UI
  int64 seq = 14;             // event seq that last changed this message (edits, reactions, replies bump it)
  int64 created_seq = 15;     // seq of message_created; never changes. Compare this with last_read_seq.
}

message ReadState {
  string channel_id = 1;
  int64 last_read_seq = 2;
  int32 unread_count = 3;
  int32 mention_count = 4;
}

// ---------------------------------------------------------------------------
// Server info (public, no auth)
// ---------------------------------------------------------------------------

message GetServerInfoRequest {}
message GetServerInfoResponse {
  string name = 1;
  string description = 2;              // Markdown, shown in the sidebar
  string icon_url = 3;
  int32 protocol_version = 4;          // currently 1
  repeated string trusted_issuers = 5; // auth issuers this server accepts, e.g. "https://sblurp.chat"
  string base_url = 6;                 // canonical URL; also the JWT audience
  int32 member_count = 7;
  string accent_color = 8;             // optional "#rrggbb" for the rail icon
  bool invite_only = 9;                // Join needs a valid invite_code
  // Questions a plugin asks people who join; show each with a text field
  // and send the answers in JoinRequest.answers, in the same order.
  repeated string join_questions = 10;
  Attachment banner = 11;              // optional image above the name in the sidebar
}

// ---------------------------------------------------------------------------
// Joining
// ---------------------------------------------------------------------------

// Authentication: every call except GetServerInfo carries
//   Authorization: Bearer <token>
// The token is either
//   (a) a JWT from a trusted issuer with aud = this server's base_url, or
//   (b) a bot token ("sbb_..."), created by an admin.
// A human token for a person who has not joined yet is accepted only by Join
// and GetServerInfo; other calls return PERMISSION_DENIED.

message JoinRequest {
  // Profile fields the user agreed to share with this community.
  string display_name = 1;
  string avatar_url = 2;
  string bio = 3;
  string invite_code = 4;     // checked only when the server is invite_only; case-insensitive
  repeated string answers = 5; // to GetServerInfoResponse.join_questions, in order
}
message JoinResponse {
  Member member = 1;
  bool created = 2;           // false if already a member
}

message GetMeRequest {}
message GetMeResponse {
  Member member = 1;
  // The next three are for admins and the owner only; empty for others.
  string server_version = 2;   // "1.2.3", "1.3.0-beta.1", "nightly-20261016-abc1234" or "dev"
  string server_track = 3;     // "stable", "beta" or "nightly"
  string update_available = 4; // a newer version on server_track, or ""
}

message UpdateProfileRequest {
  optional string display_name = 1;
  optional string avatar_url = 2;
  optional string bio = 3;
  optional string status_text = 4;
  optional string status_emoji = 5;
}
message UpdateProfileResponse {
  Member member = 1;
}

// ---------------------------------------------------------------------------
// Sync
// ---------------------------------------------------------------------------

// Everything a client needs to render the sidebar after connecting.
message GetStateRequest {}
message GetStateResponse {
  Member me = 1;
  repeated Channel channels = 2;      // channels I am in (my sidebar), incl. DMs
  repeated Member members = 3;
  repeated ReadState read_states = 4;
  int64 seq = 5;                      // server seq at snapshot time; Subscribe from here
  repeated Role roles = 6;            // sorted by position
  ChannelMode channel_mode = 7;
}

message SubscribeRequest {
  // Last seq the client has applied. The server first replays every event
  // after it (that the caller may see), then streams live events.
  // If the gap is too large the server sends Event.resync and the client
  // must call GetState again.
  int64 after_seq = 1;
}

message TypingEvent {
  string channel_id = 1;
  string member_id = 2;
  string thread_root_id = 3;
}

message PresenceEvent {
  string member_id = 1;
  Presence presence = 2;
}

message Event {
  int64 seq = 1;              // 0 for ephemeral events (typing, presence, heartbeat)
  int64 at_ms = 2;
  oneof kind {
    Message message_created = 10;
    Message message_updated = 11;   // edits, reactions, reply counts
    Message message_deleted = 12;
    Channel channel_created = 13;
    Channel channel_updated = 14;
    string channel_deleted = 15;    // channel id
    Member member_joined = 16;
    Member member_updated = 17;
    string member_left = 18;        // member id
    ReadState read_state = 19;      // my own read state, from another device
    TypingEvent typing = 20;        // ephemeral
    PresenceEvent presence = 21;    // ephemeral
    bool heartbeat = 22;            // ephemeral, every 25s keeps proxies open
    bool resync = 23;               // client must call GetState
    Role role_updated = 24;         // created or changed
    string role_deleted = 25;       // role id; drop it from members and channels
    ChannelMode channel_mode_changed = 26;
    bool server_updated = 27;       // description, banner or icon changed; call GetServerInfo
    bool emoji_changed = 28;        // custom emoji added or deleted; refetch GET /emoji
  }
}

// ---------------------------------------------------------------------------
// Channels and messages
// ---------------------------------------------------------------------------

// Admin or owner only. Names are normalized: "Book Club" becomes book-club.
message CreateChannelRequest {
  string name = 1;
  ChannelKind kind = 2;       // TEXT or PRIVATE
  string topic = 3;
  string category = 4;
}
message CreateChannelResponse { Channel channel = 1; }

// Admin or owner only. DMs cannot be updated.
message UpdateChannelRequest {
  string channel_id = 1;
  optional string name = 2;
  optional string topic = 3;
  optional string category = 4;
  optional int32 position = 5;
  // An uploaded image's id (POST /upload) for the header; "" removes it.
  optional string header_image_id = 6;
}
message UpdateChannelResponse { Channel channel = 1; }

// Who can see a TEXT channel, and whether OPT_IN joins new members to it.
// Admins only. Replaces role_ids.
message SetChannelAccessRequest {
  string channel_id = 1;
  repeated string role_ids = 2;
  bool is_default = 3;
}
message SetChannelAccessResponse { Channel channel = 1; }

// Every TEXT channel I can see, joined or not (OPT_IN's "Browse channels").
message BrowseChannelsRequest {}
message BrowseChannelsResponse { repeated Channel channels = 1; }

// OPT_IN mode only (FAILED_PRECONDITION in ROLES mode). TEXT channels only.
message JoinChannelRequest { string channel_id = 1; }
message JoinChannelResponse { Channel channel = 1; }
message LeaveChannelRequest { string channel_id = 1; }
message LeaveChannelResponse {}

// Any member, with 1 to 8 others. Returns the existing DM when one has
// exactly these members.
message OpenDMRequest {
  repeated string member_ids = 1; // the others; the caller is added
}
message OpenDMResponse { Channel channel = 1; }

message ListMessagesRequest {
  string channel_id = 1;
  string thread_root_id = 2;  // set to list a thread's replies
  string before_id = 3;       // page backwards from this message; empty = newest
  int32 limit = 4;            // default 50, max 200
  // Set at most one of before_id, after_id and around_id.
  string around_id = 5;       // this message, about limit/2 older ones and the rest newer (jump to a search hit)
  string after_id = 6;        // page forwards from this message (newer ones)
}
message ListMessagesResponse {
  repeated Message messages = 1; // oldest first
  bool has_more = 2;             // older messages exist before the first one
  bool has_more_after = 3;       // newer messages exist after the last one (after_id and around_id only)
}

// Any member who can see the channel. Text up to 8,000 characters, at most
// 10 attachments. People may send 5 messages per second (burst 10); bots
// follow the server's -bot-rate and -bot-burst.
message SendMessageRequest {
  string channel_id = 1;
  string text = 2;
  string thread_root_id = 3;
  string client_id = 4;       // idempotency key from the client
  repeated string attachment_ids = 5;
}
message SendMessageResponse { Message message = 1; }

// Your own messages only.
message EditMessageRequest {
  string message_id = 1;
  string text = 2;
}
message EditMessageResponse { Message message = 1; }

// Your own messages, or anyone's for a moderator or higher.
message DeleteMessageRequest { string message_id = 1; }
message DeleteMessageResponse {}

// At most 50 different emoji per message.
message ReactRequest {
  string message_id = 1;
  string emoji = 2;
  bool remove = 3;
}
message ReactResponse { Message message = 1; }

message MarkReadRequest {
  string channel_id = 1;
  int64 seq = 2;
}
message MarkReadResponse { ReadState read_state = 1; }

message SetTypingRequest {
  string channel_id = 1;
  string thread_root_id = 2;
}
message SetTypingResponse {}

message SearchRequest {
  string query = 1;
  string channel_id = 2;      // optional filter
  int32 limit = 3;            // default 20, max 100
}
message SearchResponse { repeated Message messages = 1; }

// ---------------------------------------------------------------------------
// Membership and moderation
//
// Rank: owner > admin > moderator > member. Nobody acts on a member of equal
// or higher rank.
// ---------------------------------------------------------------------------

// Any member of a private channel may add others to it. The new members get
// channel_updated (treat it as an upsert).
message AddChannelMembersRequest {
  string channel_id = 1;
  repeated string member_ids = 2; // max 50
}
message AddChannelMembersResponse { Channel channel = 1; }

// Removes a member from a private channel. Your own id leaves the channel;
// anyone else needs moderator or higher and a higher rank than theirs. The
// removed member gets channel_deleted (the channel is gone for them); the
// rest get channel_updated.
message RemoveChannelMemberRequest {
  string channel_id = 1;
  string member_id = 2;
}
message RemoveChannelMemberResponse { Channel channel = 1; }

// Admin or owner only. The new role must be MEMBER, MODERATOR or ADMIN and
// lower than the caller's, and the target must rank lower than the caller.
message SetMemberRoleRequest {
  string member_id = 1;
  MemberRole role = 2;
}
message SetMemberRoleResponse { Member member = 1; }

// Leave this community. The owner cannot leave. You may Join again later.
// Others get member_left.
message LeaveCommunityRequest {}
message LeaveCommunityResponse {}

// Moderator or higher, and a higher rank than the target. The target leaves
// the community and its private channels but may Join again. Not for bots
// (use BotService.DeleteBot).
message KickMemberRequest { string member_id = 1; }
message KickMemberResponse {}

// Like KickMember, and the person's login (iss, sub) cannot Join again.
message BanMemberRequest { string member_id = 1; }
message BanMemberResponse {}

// A banned login. The member row stays, so member.id keeps working.
message Ban {
  Member member = 1;          // the profile they had when banned
  string banned_by = 2;       // member id
  int64 banned_at_ms = 3;
}

// Moderator or higher. Newest first.
message ListBansRequest {}
message ListBansResponse { repeated Ban bans = 1; }

// Moderator or higher. The login may Join again (with an invite if the
// community is invite-only) and comes back with the same member id.
message UnbanMemberRequest { string member_id = 1; }
message UnbanMemberResponse {}

// ---------------------------------------------------------------------------
// Invites and settings (admin or owner)
//
// An open community lets anyone with a valid login Join. An invite-only one
// needs JoinRequest.invite_code, except for the first person (the owner) and
// people who are already members. A banned login cannot join either way.
// ---------------------------------------------------------------------------

message Invite {
  string code = 1;            // 10 characters, A-Z and 2-7
  string created_by = 2;      // member id
  int64 created_at_ms = 3;
  int64 expires_at_ms = 4;    // 0 = never
  int32 max_uses = 5;         // 0 = no limit
  int32 uses = 6;             // joins it allowed so far
}

message CreateInviteRequest {
  int64 expires_in_seconds = 1; // 0 = never; max one year
  int32 max_uses = 2;           // 0 = no limit
}
message CreateInviteResponse { Invite invite = 1; }

// Every invite that was not revoked, newest first, including expired and
// used-up ones (compare expires_at_ms and uses to show their state).
message ListInvitesRequest {}
message ListInvitesResponse { repeated Invite invites = 1; }

message RevokeInviteRequest { string code = 1; }
message RevokeInviteResponse {}

message UpdateServerSettingsRequest {
  optional bool invite_only = 1;
  ChannelMode channel_mode = 2;       // UNSPECIFIED = leave as is
  optional string description = 3;    // Markdown; "" falls back to the server's -description
  optional string banner_id = 4;      // an uploaded image's id (POST /upload); "" removes it
  optional string icon_id = 5;        // rail icon, an uploaded image's id; "" falls back to -icon-url
}
message UpdateServerSettingsResponse {
  bool invite_only = 1;
  ChannelMode channel_mode = 2;
  string description = 3;
  Attachment banner = 4;
  string icon_url = 5;
}

// Roles (admins only, except that everyone sees them in GetState).

message CreateRoleRequest {
  string name = 1;
  string color = 2;           // "#rrggbb" or empty
}
message CreateRoleResponse { Role role = 1; }

message UpdateRoleRequest {
  string role_id = 1;
  optional string name = 2;
  optional string color = 3;
  optional int32 position = 4;
}
message UpdateRoleResponse { Role role = 1; }

// Fails with FAILED_PRECONDITION while the role still limits a channel, so
// deleting a role never opens a channel to everyone.
message DeleteRoleRequest { string role_id = 1; }
message DeleteRoleResponse {}

// Replaces the member's roles. Works for bots too.
message SetMemberRolesRequest {
  string member_id = 1;
  repeated string role_ids = 2;
}
message SetMemberRolesResponse { Member member = 1; }

// ---------------------------------------------------------------------------
// Custom emoji
//
// Messages and reactions use a custom emoji as ":name:". Unknown names are
// plain text. The list and the uploads are plain HTTP, see server/README.md:
//   GET  {base}/emoji      ListEmojiResponse as protojson, with an ETag.
//                          Send If-None-Match; 304 means nothing changed.
//   POST {base}/emoji      multipart "file" parts (images or .zip files);
//                          moderator or higher. Reply: UploadEmojiResponse.
//   GET  {base}/emoji.zip  every emoji as name.ext in one zip.
//   GET  {base}/emoji/{id} the image, public, cached forever.
// After a change every member gets Event.emoji_changed.
// ---------------------------------------------------------------------------

message CustomEmoji {
  string name = 1;            // 1 to 62 of a-z, 0-9, - and _; unique on this server
  string url = 2;             // relative to the server base URL; never changes, cache forever
}

message ListEmojiResponse {
  repeated CustomEmoji emoji = 1; // sorted by name
}

enum EmojiUploadStatus {
  EMOJI_UPLOAD_STATUS_UNSPECIFIED = 0;
  EMOJI_UPLOAD_STATUS_ADDED = 1;
  EMOJI_UPLOAD_STATUS_EXISTS = 2;   // skipped: the name is taken
  EMOJI_UPLOAD_STATUS_REJECTED = 3; // see error
}

message EmojiUploadResult {
  string file = 1;            // the file name, or its path inside a zip
  string name = 2;            // emoji name made from the file name
  EmojiUploadStatus status = 3;
  string error = 4;           // why it was rejected
}

message UploadEmojiResponse { repeated EmojiUploadResult results = 1; }

// Moderator or higher.
message DeleteEmojiRequest { string name = 1; }
message DeleteEmojiResponse {}

// ---------------------------------------------------------------------------
// Bots
// ---------------------------------------------------------------------------

// Admin or owner only. username is 2 to 32 of a-z, 0-9, _, . and -.
message CreateBotRequest {
  string username = 1;
  string display_name = 2;
  string avatar_url = 3;
  string bio = 4;
}
message CreateBotResponse {
  Member bot = 1;
  string token = 2;           // shown once; the server stores only a hash
}

// Any member.
message ListBotsRequest {}
message ListBotsResponse { repeated Member bots = 1; }

// Admin or owner only. The old token stops working at once.
message RotateBotTokenRequest { string bot_id = 1; }
message RotateBotTokenResponse { string token = 1; }

// Admin or owner only. The bot's messages stay; its username is freed.
message DeleteBotRequest { string bot_id = 1; }
message DeleteBotResponse {}

// ---------------------------------------------------------------------------
// Services
// ---------------------------------------------------------------------------

service ServerService {
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse) {}
  rpc Join(JoinRequest) returns (JoinResponse) {}
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {}
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {}
  rpc GetState(GetStateRequest) returns (GetStateResponse) {}
  // Server stream. Browsers support server streams over Connect; there is
  // deliberately no bidirectional stream. Clients send with unary calls.
  rpc Subscribe(SubscribeRequest) returns (stream Event) {}
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse) {}
  rpc LeaveCommunity(LeaveCommunityRequest) returns (LeaveCommunityResponse) {}
  rpc KickMember(KickMemberRequest) returns (KickMemberResponse) {}
  rpc BanMember(BanMemberRequest) returns (BanMemberResponse) {}
  rpc ListBans(ListBansRequest) returns (ListBansResponse) {}
  rpc UnbanMember(UnbanMemberRequest) returns (UnbanMemberResponse) {}
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse) {}
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse) {}
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse) {}
  rpc UpdateServerSettings(UpdateServerSettingsRequest) returns (UpdateServerSettingsResponse) {}
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {}
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {}
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {}
  rpc SetMemberRoles(SetMemberRolesRequest) returns (SetMemberRolesResponse) {}
  rpc DeleteEmoji(DeleteEmojiRequest) returns (DeleteEmojiResponse) {}
}

service ChatService {
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse) {}
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse) {}
  rpc OpenDM(OpenDMRequest) returns (OpenDMResponse) {}
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {}
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {}
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse) {}
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse) {}
  rpc React(ReactRequest) returns (ReactResponse) {}
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse) {}
  rpc SetTyping(SetTypingRequest) returns (SetTypingResponse) {}
  rpc Search(SearchRequest) returns (SearchResponse) {}
  rpc AddChannelMembers(AddChannelMembersRequest) returns (AddChannelMembersResponse) {}
  rpc RemoveChannelMember(RemoveChannelMemberRequest) returns (RemoveChannelMemberResponse) {}
  rpc SetChannelAccess(SetChannelAccessRequest) returns (SetChannelAccessResponse) {}
  rpc BrowseChannels(BrowseChannelsRequest) returns (BrowseChannelsResponse) {}
  rpc JoinChannel(JoinChannelRequest) returns (JoinChannelResponse) {}
  rpc LeaveChannel(LeaveChannelRequest) returns (LeaveChannelResponse) {}
}

service BotService {
  rpc CreateBot(CreateBotRequest) returns (CreateBotResponse) {}
  rpc ListBots(ListBotsRequest) returns (ListBotsResponse) {}
  rpc RotateBotToken(RotateBotTokenRequest) returns (RotateBotTokenResponse) {}
  rpc DeleteBot(DeleteBotRequest) returns (DeleteBotResponse) {}
}
